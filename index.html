<style>
:root{
  --bg:#EDEFEA;
  --bg-2:#E4E8E1;
  --surface:#FFFFFF;
  --ink:#0F1D19;
  --ink-2:#1B2E28;
  --muted:#6C7B75;
  --line:#DCE1DA;
  --teal:#0B5C55;
  --teal-2:#0E766C;
  --teal-soft:#E2EEEB;
  --gold:#C08A1E;
  --gold-soft:#F5EBD7;
  --rose:#9E2F4F;
  --f-imani:#0B5C55; --f-shari:#274690; --f-thaqafi:#71397A;
  --f-mahari:#A85E18; --f-adabi:#992B4A;
  --r:16px;
  --sh-1:0 1px 2px rgba(15,29,25,.04);
  --sh-2:0 2px 6px rgba(15,29,25,.05), 0 18px 40px -28px rgba(15,29,25,.5);
  --sh-3:0 30px 70px -30px rgba(15,29,25,.45);
  --ease:cubic-bezier(.22,.9,.25,1);
  --spring:cubic-bezier(.2,1.25,.4,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,.display{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:800;line-height:1.15;margin:0}
h1{font-size:clamp(38px,7vw,58px)}
h2{font-size:clamp(22px,3vw,28px)}
h3{font-size:20px;font-weight:700}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;letter-spacing:-.02em}
.eyebrow{font-size:11px;color:var(--muted);margin:0 0 6px;font-weight:500}
.eyebrow .num{letter-spacing:.1em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.spacer{flex:1}

/* ==================== الحركة ==================== */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes dropdown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-6px)}}
@keyframes popin{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.1);opacity:0}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.08)}100%{transform:translate(0,0) scale(1)}}
@keyframes sheen{from{background-position:200% 0}to{background-position:-120% 0}}
@keyframes climb{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.anim .stagger{opacity:0}
.anim .stagger.in{animation:rise .62s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.topbar{animation:dropdown .5s var(--ease) both}

/* ==================== الشريط العلوي ==================== */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(105deg,var(--ink) 0%,var(--ink-2) 60%,#123029 100%);
  color:#E9EDE9;
}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Reem Kufi",sans-serif;font-size:23px;font-weight:700}
.brand svg{width:27px;height:23px}
.brand:hover .s1{transform:translateY(-2px)}
.brand:hover .s2{transform:translateY(-1px)}
.brand .s1,.brand .s2{transition:transform .35s var(--spring)}
.whoami{font-size:13px;color:#9FB0A9;text-align:left;line-height:1.4}
.whoami b{display:block;color:#fff;font-weight:600;font-size:14px}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#D5DED9;padding:7px 14px;border-radius:999px;font-size:13px;transition:.25s var(--ease)}
.btn-ghost:hover{background:rgba(255,255,255,.14);color:#fff}

/* ==================== التبويبات ==================== */
.tabs{position:relative;display:flex;gap:2px;border-bottom:1px solid var(--line);margin:26px 0 26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:11px 16px;color:var(--muted);font-size:15px;white-space:nowrap;transition:color .25s}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs button:hover{color:var(--ink-2)}
.tab-ind{position:absolute;bottom:-1px;height:2.5px;background:var(--teal);border-radius:2px;transition:right .45s var(--spring),width .45s var(--spring)}

/* ==================== البطاقات ==================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh-1);transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
.card:hover{box-shadow:var(--sh-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}

/* ==================== الدخول ==================== */
main.anim{animation:viewin .45s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn,.startbtn,.filter,.movebtn{position:relative;overflow:hidden}
.card,.scard,.field,.bookcard,.ccard,.shcard{will-change:transform}
.tabs button{position:relative}
.tabs button::after{content:"";position:absolute;inset:auto 14px 6px;height:1.5px;background:currentColor;
 transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease);opacity:.35}
.tabs button:hover::after{transform:scaleX(1)}
.tabs button[aria-selected="true"]::after{display:none}
.login{position:relative;min-height:100vh;display:grid;place-items:center;padding:26px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:drift 18s ease-in-out infinite}
.b1{width:460px;height:460px;background:#BFD8D3;top:-140px;right:-120px}
.b2{width:380px;height:380px;background:#EADCB8;bottom:-120px;left:-100px;animation-delay:-7s}
.login-card{position:relative;width:100%;max-width:400px;text-align:center}
.login-card>*{animation:rise .7s var(--ease) both}
.login-card>*:nth-child(1){animation-delay:.05s}
.login-card>*:nth-child(2){animation-delay:.14s}
.login-card>*:nth-child(3){animation-delay:.2s}
.login-card>*:nth-child(4){animation-delay:.27s}
.login-card>*:nth-child(5){animation-delay:.33s}
.login-card>*:nth-child(6){animation-delay:.39s}
.login-card>*:nth-child(7){animation-delay:.45s}
.login-card>*:nth-child(8){animation-delay:.5s}
.logo-lg{width:74px;height:62px;margin-inline:auto;display:block}
.logo-lg rect{animation:grow .75s var(--spring) both;transform-box:fill-box;transform-origin:bottom}
.logo-lg rect:nth-child(1){animation-delay:.1s}
.logo-lg rect:nth-child(2){animation-delay:.24s}
.logo-lg rect:nth-child(3){animation-delay:.38s}
.login h1{margin:14px 0 2px;letter-spacing:-.01em}
.login .sub{color:var(--muted);margin:0 0 26px;font-size:14.5px}
.code-wrap{display:flex;gap:10px;justify-content:center;direction:ltr}
.digit{
  width:60px;height:70px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;
  transition:.3s var(--spring);box-shadow:var(--sh-1)
}
.digit.filled{border-color:var(--teal);color:var(--teal);transform:translateY(-3px);box-shadow:0 8px 18px -10px var(--teal)}
.digit.active{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.digit span{animation:popin .3s var(--spring)}
.code-wrap.bad{animation:shake .45s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.keypad button{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px 0;font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--ink);
  transition:.22s var(--ease);box-shadow:var(--sh-1)
}
.keypad button:hover{background:var(--teal-soft);border-color:#A9CCC6;transform:translateY(-2px)}
.keypad button:active{transform:scale(.94)}
.ripple{position:absolute;border-radius:50%;background:rgba(11,92,85,.22);transform:translate(-50%,-50%) scale(0);animation:rip .55s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(9);opacity:0}}
.btn{
  position:relative;overflow:hidden;background:var(--teal);color:#fff;border:0;border-radius:13px;
  padding:14px 22px;font-size:15.5px;font-weight:500;width:100%;transition:.25s var(--ease);
  box-shadow:0 10px 24px -14px var(--teal)
}
.btn:hover{background:var(--teal-2);transform:translateY(-2px);box-shadow:0 16px 30px -16px var(--teal)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.sm{width:auto;padding:9px 17px;font-size:13.5px;border-radius:11px}
.btn.outline{background:transparent;color:var(--teal);border:1.5px solid #B7D2CE;box-shadow:none}
.btn.outline:hover{background:var(--teal-soft);border-color:var(--teal)}
.err{color:var(--rose);font-size:13.5px;min-height:22px;margin-top:12px;transition:.3s}
.hint{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:2.1}
.hint code{font-family:"IBM Plex Mono",monospace;background:var(--teal-soft);color:var(--teal);padding:3px 8px;border-radius:7px;cursor:pointer;transition:.2s}
.hint code:hover{background:var(--teal);color:#fff}
.leaving{animation:fadeout .45s var(--ease) forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(-14px) scale(.97)}}

/* ==================== حلقة الأسبوع ==================== */
.today{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.ring-row{display:flex;align-items:center;gap:22px;margin-top:6px}
.ring{width:150px;height:150px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:#E9ECE7}
.ring .arc{transition:stroke-dashoffset 1.2s var(--ease)}
.ring-box{position:relative;flex:none}
.ring-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-mid b{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;line-height:1}
.ring-mid span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:16px;min-width:0}
.legend .k{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.legend .v{font-family:"IBM Plex Mono",monospace;font-size:25px;font-weight:600;line-height:1.2}
.legend .v small{font-family:"IBM Plex Sans Arabic";font-size:12.5px;color:var(--muted);font-weight:400}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block}
.guard{display:flex;align-items:center;gap:11px;border-radius:14px;padding:12px 15px;margin-top:18px;font-size:13.5px;
 background:#FCF6E9;border:1px solid #EBDCBB;color:#7A5A11}
.guard.ok{background:var(--teal-soft);border-color:#BFE0DA;color:var(--teal)}
.guard.risk{background:#FCF3F5;border-color:#F0D9DF;color:#7C2440}
.guard .gi{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.75);display:grid;place-items:center;flex:none;font-size:15px}
.guard b{font-weight:600}
.donebadge{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;animation:popin .5s var(--spring)}
.pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--teal);animation:ring 2.6s var(--ease) infinite;pointer-events:none}

/* عدّاد الإقفال ووتيرة الأسبوع */
@keyframes blink{50%{opacity:.25}}
@keyframes ticknudge{0%{transform:translateY(-3px);opacity:0}100%{transform:none;opacity:1}}
.weekhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.weekhead .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lockchip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:12.5px;
 background:#F1F3F0;color:var(--muted);font-weight:500;white-space:nowrap}
.lockchip .tick{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.lockchip.soon{background:var(--gold-soft);color:#7A5A11}
.lockchip.soon .tick{background:var(--gold);animation:blink 1.6s ease-in-out infinite}
.lockchip b{font-weight:600;color:var(--ink-2)}
.lockchip b.upd{display:inline-block;animation:ticknudge .45s var(--ease)}
.pace{margin-top:20px}
.pace .pl{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:8px}
.pace .pl b{color:var(--ink);font-weight:600}
.pacebar{position:relative;height:10px;border-radius:99px;background:#E9ECE7}
.pacebar i{display:block;height:100%;width:0;border-radius:99px;
 background:linear-gradient(270deg,var(--teal-2),var(--teal));transition:width 1.2s var(--ease)}
.pacebar.ahead i{background:linear-gradient(270deg,#2F8C7F,var(--teal))}
.pacebar.behind i{background:linear-gradient(270deg,#D8A33A,var(--gold))}
.pacebar u{position:absolute;top:-5px;bottom:-5px;width:2.5px;margin-right:-1.25px;border-radius:2px;
 background:var(--ink);opacity:.6;transition:right 1.2s var(--ease)}
.pace .pn{margin-top:8px;font-size:12px;color:var(--muted)}
.wtagmini{font-size:10px;background:var(--gold-soft);color:#8A6210;border-radius:999px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.tent .tday{font-size:11.5px;color:var(--muted);flex:none}

/* ==================== السلّم ==================== */
.stairs{width:100%;height:158px;display:block;margin-top:6px}
.stair-bar{transform-box:fill-box;transform-origin:bottom}
.stagger.in .stair-bar{animation:grow .7s var(--spring) both;animation-delay:calc(var(--i)*80ms + 220ms)}
.stair-lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--muted)}
.stagger.in .stair-lbl{animation:fadein .5s both;animation-delay:calc(var(--i)*80ms + 400ms)}
.streak{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.flame{width:15px;height:15px;fill:var(--gold)}

/* ==================== المجالات ==================== */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:13px}
.field{
  position:relative;text-align:right;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 18px 15px;overflow:hidden;
  transition:transform .4s var(--spring),box-shadow .4s var(--ease),border-color .3s
}
.field::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c);transition:width .4s var(--spring)}
.field::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,var(--c) 0%,transparent 62%);opacity:0;transition:opacity .4s}
.field:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:transparent}
.field:hover::before{width:7px}
.field:hover::after{opacity:.07}
.field h3{margin:0 0 1px;font-size:23px;color:var(--c)}
.field p{margin:0;color:var(--muted);font-size:12.5px}
.field .tally{margin-top:14px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink);opacity:.75}
.field .go{position:absolute;left:16px;bottom:14px;opacity:0;transform:translateX(6px);transition:.35s var(--ease);color:var(--c);font-size:17px}
.field:hover .go{opacity:1;transform:none}

/* ==================== اختيار شخصي (ثانوي) ==================== */
.personal-zone{
  margin-top:14px;padding:15px 17px;border:1px dashed #C8D2CB;border-radius:14px;background:rgba(255,255,255,.52);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap
}
.personal-zone .pcopy{flex:1;min-width:220px}
.personal-zone .pcopy b{display:block;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.personal-zone .pcopy p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.personal-actions{display:flex;gap:7px;flex-wrap:wrap}
.personal-add{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:12.5px;transition:.25s var(--ease)}
.personal-add:hover{border-color:#AEBBB4;color:var(--ink);transform:translateY(-1px)}
.personal-paused{width:100%;display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:10px;border-top:1px solid rgba(220,225,218,.8)}
.personal-paused>span{font-size:11.5px;color:var(--muted)}
.personal-resume{border:0;background:#F1F3F0;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:11.5px;transition:.22s var(--ease)}
.personal-resume:hover{background:var(--teal-soft);color:var(--teal)}
@media(max-width:560px){.personal-actions{width:100%}.personal-add{flex:1}.personal-zone{align-items:stretch}}

/* ==================== الصفوف ==================== */
.course{display:flex;align-items:center;gap:13px;padding:14px 6px;border-bottom:1px solid var(--line);transition:background .25s,padding .3s var(--ease);border-radius:10px}
.course:last-child{border-bottom:0}
.course:hover{background:#F7F9F6;padding-inline:12px}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--teal-soft);flex:none;transition:.35s var(--spring)}
.course:hover .ic{transform:scale(1.08) rotate(-4deg)}
.ic svg{width:18px;height:18px;stroke:var(--teal);fill:none;stroke-width:1.7;stroke-linecap:round}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;font-size:14.5px}
.meta span{color:var(--muted);font-size:12.5px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ==================== الجداول ==================== */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-weight:600;font-size:12px;color:var(--muted);padding:0 10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .25s}
tbody tr:hover{background:#F7F9F6}
.stagger.in tbody tr{animation:climb .5s var(--ease) both;animation-delay:calc(var(--i)*55ms + 180ms)}
.rank{font-family:"IBM Plex Mono",monospace;color:var(--muted);width:38px;font-size:15px}
.rank.top{color:var(--gold);font-weight:700;font-size:17px}
.bar{height:8px;background:#E9ECE7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:99px;transition:width 1s var(--ease)}
.bar.g i{background:var(--gold)}
.me-row{background:linear-gradient(90deg,var(--teal-soft),transparent 70%)!important}

/* ==================== النوافذ ==================== */
.overlay{position:fixed;inset:0;background:rgba(15,29,25,.42);backdrop-filter:blur(3px);
 display:flex;align-items:flex-start;justify-content:center;padding:18px;z-index:50;
 overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:fadein .28s}
.modal{position:relative;background:var(--surface);border-radius:20px;width:100%;max-width:430px;
 padding:26px 26px 0;margin:auto;box-shadow:var(--sh-3);animation:popin .48s var(--spring);
 max-height:calc(100dvh - 36px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.modal::-webkit-scrollbar{width:6px}
.modal::-webkit-scrollbar-thumb{background:#D3DAD4;border-radius:99px}
.modal::-webkit-scrollbar-track{background:transparent}
.modal h3{margin:0 0 3px;font-size:24px;position:sticky;top:-26px;background:var(--surface);
 padding:4px 0 2px;z-index:2}
@media(max-height:620px){.modal{padding-top:20px}.modal h3{font-size:21px;top:-20px}
 label{margin:12px 0 6px}}
.modal .sub{color:var(--muted);font-size:13px;margin:0 0 6px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 7px}
input[type=text],input[type=number],input[type=url],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--ink);transition:.25s}
input:focus,select:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px var(--teal-soft)}
.row{display:flex;gap:10px;margin-top:24px;position:sticky;bottom:0;z-index:2;
 background:var(--surface);padding:14px 0 20px}
.row::before{content:"";position:absolute;inset:auto 0 100% 0;height:22px;pointer-events:none;
 background:linear-gradient(transparent,var(--surface))}
.row .btn{flex:1}
.seg{display:flex;gap:6px;background:#F1F3F0;padding:5px;border-radius:13px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;color:var(--muted);font-size:13.5px;transition:.28s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.empty{text-align:center;color:var(--muted);padding:38px 12px;font-size:14px}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:13.5px;margin-bottom:12px;transition:.25s}
.back:hover{color:var(--ink);transform:translateX(-3px)}
.toast{
  position:fixed;bottom:26px;right:50%;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
  font-size:14px;z-index:60;box-shadow:var(--sh-3);animation:toastin .5s var(--spring)
}
@keyframes toastin{from{opacity:0;transform:translate(50%,26px)}to{opacity:1;transform:translate(50%,0)}}
.toast{transform:translateX(50%)}
.sheen{background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.5) 45%,transparent 70%);background-size:220% 100%;animation:sheen 2.2s var(--ease)}

/* ==================== لوحات المشرفين ==================== */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--sh-1);transition:.35s var(--ease)}
.stat:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.stat::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--sc,var(--teal));transform:scaleX(0);transform-origin:right}
.stat.stagger.in::after{animation:barin .9s var(--ease) forwards;animation-delay:calc(var(--i)*90ms + 280ms)}
@keyframes barin{to{transform:scaleX(1)}}
.stat .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-family:"IBM Plex Mono",monospace;font-size:31px;font-weight:600;line-height:1.3;color:var(--sc,var(--ink))}
.stat .val small{font-family:"IBM Plex Sans Arabic";font-size:12.5px;color:var(--muted);font-weight:400}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 15px}
.filter{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 16px;font-size:13px;transition:.28s var(--ease)}
.filter:hover{border-color:var(--teal);color:var(--teal)}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filter .cnt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;opacity:.65;margin-right:5px}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:13px}
.scard{position:relative;overflow:hidden;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh-1);transition:transform .42s var(--spring),box-shadow .42s var(--ease),border-color .3s}
.scard::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--sc,var(--teal));transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--spring)}
.scard:hover{transform:translateY(-5px);box-shadow:var(--sh-2)}
.scard:hover::after{transform:scaleY(1)}
.scard .head{display:flex;align-items:center;gap:11px}
.avatar{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:"Zain",sans-serif;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(145deg,var(--sc,var(--teal)),#0F3F3A);transition:.4s var(--spring)}
.scard:hover .avatar{transform:rotate(-5deg) scale(1.06)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:12px;color:var(--muted)}
.ringwrap{position:relative;width:46px;height:46px;flex:none}
.ringlet{width:46px;height:46px;transform:rotate(-90deg)}
.ringlet circle{fill:none;stroke-width:5;stroke-linecap:round}
.ringlet .t{stroke:#EAEDE8}
.ringlet .a{transition:stroke-dashoffset 1.1s var(--ease)}
.ringwrap b{position:absolute;inset:0;display:grid;place-content:center;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--sc,var(--teal))}
.mini{width:100%;height:46px;display:block;margin-top:13px}
.mini rect{transform-box:fill-box;transform-origin:bottom}
.stagger.in .mini rect{animation:grow .55s var(--spring) both;animation-delay:calc(var(--j)*55ms + 320ms)}
.scard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.mid{background:var(--gold-soft);color:#8A6210}
.pill.off{background:#F7E8EC;color:var(--rose)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:19px;box-shadow:var(--sh-1);transition:.4s var(--ease)}
.pcard:hover{box-shadow:var(--sh-2);transform:translateY(-3px)}
.codebox{font-family:"IBM Plex Mono",monospace;font-size:18px;letter-spacing:.26em;color:var(--teal);background:var(--teal-soft);border-radius:11px;padding:8px 6px 8px 14px;display:inline-block;direction:ltr;transition:.3s}
.pcard:hover .codebox{background:var(--teal);color:#fff}
.split{display:flex;gap:18px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.split div{flex:1}
.split .k{font-size:11.5px;color:var(--muted)}
.split .v{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600}
.fcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.fcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh-1);position:relative;overflow:hidden;transition:.4s var(--ease)}
.fcol:hover{box-shadow:var(--sh-2)}
.fcol::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.fhead{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:11px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.fhead h3{font-size:21px;color:var(--c)}
.alert{display:flex;align-items:center;gap:11px;background:#FCF3F5;border:1px solid #F0D9DF;color:#7C2440;border-radius:14px;padding:13px 16px;margin-bottom:16px;font-size:13.5px}
.alert svg{width:19px;height:19px;fill:none;stroke:var(--rose);stroke-width:1.8;flex:none}

/* ==================== مقررات الفترة ==================== */
.period{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:13px}
.bookcard{position:relative;overflow:hidden;display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-1);transition:transform .45s var(--spring),box-shadow .45s var(--ease)}
.bookcard:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.bookcard::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 100% 0,var(--c),transparent 65%);opacity:.05;pointer-events:none}
.cover{width:86px;flex:none}
.cover svg{width:86px;height:116px;display:block;filter:drop-shadow(0 10px 18px rgba(15,29,25,.18))}
.cover .fillbar{transition:height 1.1s var(--ease),y 1.1s var(--ease)}
.bookcard:hover .cover svg{transform:rotate(-2deg) scale(1.03);transition:transform .5s var(--spring)}
.binfo{flex:1;min-width:0;display:flex;flex-direction:column}
.binfo .kicker{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--c);font-weight:600}
.binfo h3{font-size:20px;margin:5px 0 1px;line-height:1.3}
.binfo .by{color:var(--muted);font-size:12.5px;margin:0}
.bprog{margin-top:auto;padding-top:13px}
.brow{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.brow b{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:var(--c)}
.blast{font-size:11.5px;color:var(--muted);margin-top:8px}
.badge-now{position:absolute;top:14px;left:14px;background:var(--c);color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 10px;letter-spacing:0}

/* ==================== شريط الهدف ==================== */
.goalbox{background:#F7F9F7;border:1px solid var(--line);border-radius:16px;padding:16px 17px 12px;margin-top:14px}
.gtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.gval{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;line-height:1;color:var(--gc);transition:color .3s}
.gval.pop{animation:valpop .32s var(--spring)}
@keyframes valpop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.gunit{font-size:13px;color:var(--muted);margin-right:6px}
.gday{font-size:11.5px;color:var(--muted);margin-top:6px}
.gday b{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);font-weight:600}
.gviz{display:flex;align-items:flex-end;gap:3.5px;height:36px}
.gviz i{flex:1;background:#E2E6E1;border-radius:3px;transition:background .35s var(--ease),transform .45s var(--spring),height .35s var(--ease)}
.gviz i.on{background:var(--gc)}
.sl{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;margin:16px 0 6px;direction:rtl;
 background:linear-gradient(to left,var(--gc) var(--pct),#E4E8E3 var(--pct));cursor:grab;transition:background .12s linear}
.sl:active{cursor:grabbing}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3.5px solid var(--gc);
 box-shadow:0 4px 12px -3px rgba(15,29,25,.35);transition:transform .22s var(--spring)}
.sl::-webkit-slider-thumb:hover{transform:scale(1.14)}
.sl:active::-webkit-slider-thumb{transform:scale(1.22)}
.sl::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3.5px solid var(--gc);box-shadow:0 4px 12px -3px rgba(15,29,25,.35)}
.gscale{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.presets{display:flex;gap:7px;margin-top:16px}
.presets button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 4px;font-size:13px;color:var(--muted);transition:.28s var(--ease)}
.presets button:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
.presets button b{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;opacity:.7}

/* ==================== سجل الإنجاز: خريطة الأسابيع ==================== */
@keyframes hcin{from{opacity:0;scale:1 .25}to{opacity:1;scale:1 1}}
.heat{display:grid;grid-template-columns:repeat(16,1fr);gap:5px;margin-top:16px;direction:rtl;align-items:end}
.hc{width:100%;aspect-ratio:.62;border-radius:5px;background:#EAEDE8;transform-origin:bottom;transition:transform .25s var(--spring)}
.hc.now{box-shadow:0 0 0 2px var(--gold)}
.hc:hover{transform:scale(1.18);z-index:2;position:relative}
.stagger.in .hc{animation:hcin .55s var(--spring) both;animation-delay:calc(var(--k)*32ms + 240ms)}
.hlegend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:12px;font-size:11.5px;color:var(--muted)}
.hlegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.donut{width:158px;height:158px;flex:none;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:19;transition:stroke-dasharray 1.1s var(--ease)}
.dlegend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.dl{display:flex;align-items:center;gap:8px;font-size:13px}
.dl .nm2{flex:1}
.dl .num{color:var(--muted);font-size:12px}
.tl{position:relative;padding-right:26px;margin-top:6px}
.tl::before{content:"";position:absolute;top:8px;bottom:8px;right:7px;width:2px;background:linear-gradient(var(--teal),#DCE1DA);border-radius:2px}
.tlday{position:relative;margin-bottom:11px}
.tlday.stagger.in{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*70ms + 200ms)}
.tlnode{position:absolute;right:-26px;top:16px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--nc);box-shadow:0 0 0 4px var(--bg);transition:.35s var(--spring)}
.tlday:hover .tlnode{transform:scale(1.25)}
.tlcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:.35s var(--ease)}
.tlday:hover .tlcard{box-shadow:var(--sh-2);transform:translateX(-3px)}
.tlhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.tlhead b{font-size:15.5px}
.tlhead .dt{font-size:11.5px;color:var(--muted);font-weight:400;margin-right:4px}
.mini-ring{width:34px;height:34px;transform:rotate(-90deg);flex:none}
.mini-ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.tlitems{display:flex;flex-wrap:wrap;gap:7px}
.tlitem{display:inline-flex;align-items:center;gap:7px;background:#F7F9F6;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12.5px;transition:.28s var(--ease)}
.tlitem:hover{background:var(--surface);border-color:var(--fc);transform:translateY(-2px)}
.tlitem .num{color:var(--fc);font-weight:600}
.medals{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.medal{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:10px 14px;font-size:13px;transition:.35s var(--spring)}
.medal:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.medal.off{opacity:.42;filter:grayscale(1)}
.medal .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);font-size:15px}
.medal small{display:block;color:var(--muted);font-size:11px}

/* ==================== الرفّ واختيار المقررات ==================== */
.shelfhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shelfhead .lnk{background:none;border:0;color:var(--teal);font-size:13.5px;padding:0;transition:.25s}
.shelfhead .lnk:hover{transform:translateX(-3px)}
.bactions{display:flex;gap:8px;margin-top:11px}
.bactions .btn{margin:0}
.iconbtn{width:38px;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;color:var(--muted);font-size:15px;transition:.28s var(--ease)}
.iconbtn:hover{border-color:var(--rose);color:var(--rose);transform:translateY(-2px)}
.bookcard.done{background:linear-gradient(150deg,#F4FAF8,var(--surface) 60%);border-color:#BFE0DA}
.badge-done{position:absolute;top:14px;left:14px;background:var(--teal);color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 11px;animation:popin .5s var(--spring)}
.emptyshelf{display:flex;align-items:center;gap:16px;background:var(--surface);border:1.5px dashed #C8D2CB;border-radius:var(--r);padding:22px}
.emptyshelf .ei{width:52px;height:52px;border-radius:15px;background:var(--teal-soft);display:grid;place-items:center;flex:none}
.emptyshelf .ei svg{width:25px;height:25px;stroke:var(--teal);fill:none;stroke-width:1.7}
.emptyshelf b{display:block;font-size:16px;font-family:"Zain",sans-serif;font-weight:700}
.emptyshelf p{margin:2px 0 0;color:var(--muted);font-size:13px}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-top:13px}
.ccard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;gap:13px;transition:transform .4s var(--spring),box-shadow .4s var(--ease),border-color .3s}
.ccard:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.ccard.on{border-color:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 6%,#fff),var(--surface) 65%)}
.cmini{width:44px;flex:none}
.cmini svg{width:44px;height:60px;display:block;filter:drop-shadow(0 5px 10px rgba(15,29,25,.14))}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column}
.cbody b{font-size:14.5px;font-weight:600;line-height:1.4}
.cbody .cby{color:var(--muted);font-size:12px;margin:1px 0 0}
.todaylog{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
 padding:11px 14px;background:#F7F9F6;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.tlh span{font-size:11px;font-weight:400;color:var(--muted)}
.tent{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid #F1F3F0;font-size:13.5px}
.tent:last-child{border-bottom:0}
.tenm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenv{color:var(--muted);font-size:12.5px}
.qbtn.del:hover{border-color:var(--rose);color:var(--rose)}
.loanrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.loanrow:last-child{border-bottom:0}
.lninfo{flex:1;min-width:0}
.lninfo b{display:block;font-size:14px;font-weight:600}
.lninfo span{font-size:12px;color:var(--muted)}
.lnact{display:flex;gap:6px;align-items:center;flex:none}
.avrow{display:flex;align-items:center;gap:9px;margin-top:9px}
.avail{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.avail.ok{background:var(--teal-soft);color:var(--teal)}
.avail.last{background:var(--gold-soft);color:#8A6210}
.avail.none{background:#F7E8EC;color:var(--rose)}
.avail.have{background:#EFF1EE;color:var(--muted)}
.avail.wait{background:#F1EDF6;color:#6B4A8A}
.avbar{flex:1;height:4px;border-radius:99px;background:#EFF1EE;overflow:hidden}
.avbar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .8s var(--ease)}
.startbtn.taken{border-color:#E4C3CC;color:var(--rose);background:#FCF6F7}
.startbtn.taken:hover{background:var(--rose);color:#fff;border-color:var(--rose)}
.takenbox{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tkline{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;font-size:13.5px;border-bottom:1px solid var(--line)}
.tkline:last-child{border-bottom:0}
.tkline:nth-child(odd){background:#F9FAF8}
.tkline b{font-family:"IBM Plex Mono",monospace;font-size:17px}
.copyrow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.qgrp{display:inline-flex;gap:4px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:28px;height:26px;
 color:var(--muted);font-size:13px;transition:.25s var(--ease);padding:0 8px}
.qbtn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
.cnote{margin:7px 0 0;font-size:12px;line-height:1.75;color:var(--muted);cursor:pointer;
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
 transition:color .25s var(--ease)}
.cnote:hover{color:var(--ink)}
.cnote.open{-webkit-line-clamp:99;display:block}
textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;
 font-size:14.5px;background:var(--surface);color:var(--ink);resize:vertical;line-height:1.8;transition:.25s}

<body>
<div id="app"><div id="shell"></div><div id="modalRoot"></div><div id="toastRoot"></div></div>
<script>
const REMOTE=true;
const SB=window.supabase.createClient(window.KHUTWAH_CONFIG.supabaseUrl,
 window.KHUTWAH_CONFIG.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
let REMOTE_HOLD=null,LEADERBOARD=[],CHAL_BOARD=[],REMOTE_READY=false;

/* ==================== البيانات ==================== */
const FIELDS=[
 {id:'imani',name:'إيماني',desc:'رقائق وتزكية',c:'var(--f-imani)'},
 {id:'shari',name:'شرعي',desc:'علوم الشريعة',c:'var(--f-shari)'},
 {id:'thaqafi',name:'ثقافي',desc:'فكر وواقع',c:'var(--f-thaqafi)'},
 {id:'mahari',name:'مهاري',desc:'مهارات وبناء ذات',c:'var(--f-mahari)'},
 {id:'adabi',name:'أدبي',desc:'لغة وأدب',c:'var(--f-adabi)'}];
/* الاختيارات الشخصية منفصلة عن المجالات الخمسة والمقررات العامة. */
const PERSONAL_FIELD={id:'personal',name:'خارج المقررات',desc:'اختيار شخصي',c:'#6C7B75'};
let PERSONAL_COURSES=[];
/* الوثبات: مقرر مخفي لكل وثبة يُحتسب في الإنجاز كأي تسجيل. */
const WATHBA_FIELD={id:'wathba',name:'وثبة',desc:'مادة الوثبة',c:'var(--gold)'};
let WATHBAS=[],WDONE=[],WMEM=[];
let COURSES=[];
let ARCHIVED_COURSES=[];
let STUDENTS=[];
let SUPERVISORS=[];
let OBSERVERS=[];
let CHALLENGE={active:false,title:'',desc:'',metric:'pages',target:1,start:null,end:null};
let ADMIN={code:'',name:''};

/* ==================== الزمن ====================
   الأسبوع البرنامجي يبدأ وينتهي الخميس ٣:٠٠ عصرًا بتوقيت الرياض.
   مفتاح الأسبوع = تاريخ خميس إقفاله (YYYY-MM-DD)، مطابق لدالة week_of في السيرفر.
   ساعة الجهاز تُصحَّح بفرق ساعة السيرفر حتى لا يختلف العدّاد بين الأجهزة. */
const TZ=3;          /* الرياض UTC+3 */
const DAY_START=3;   /* اليوم البرنامجي (للعهدة والوثبات) يبدأ ٣ فجرًا */
const LOCK_DOW=4,LOCK_H=15;   /* الخميس ١٥:٠٠ */
let SKEW=0;
const now=()=>Date.now()+SKEW;
function riyadhNow(){return new Date(now()+TZ*3600000)} /* حقول UTC = توقيت الرياض */
const todayISO=()=>{const d=riyadhNow();d.setUTCHours(d.getUTCHours()-DAY_START);return d.toISOString().slice(0,10)};
const dayISO=n=>{const d=riyadhNow();d.setUTCHours(d.getUTCHours()-DAY_START);d.setUTCDate(d.getUTCDate()-n);
 return d.toISOString().slice(0,10)};
function addDays(iso,n){const d=new Date(iso+'T00:00Z');d.setUTCDate(d.getUTCDate()+n);
 return d.toISOString().slice(0,10)}
function weekOfMs(ms){const d=new Date(ms+(TZ-LOCK_H)*3600000);let k=(LOCK_DOW-d.getUTCDay()+7)%7;if(!k)k=7;
 d.setUTCDate(d.getUTCDate()+k);return d.toISOString().slice(0,10)}
const curWeek=()=>weekOfMs(now());
const weekISO=n=>addDays(curWeek(),-7*n);
const lockAt=w=>Date.parse(w+'T00:00:00Z')+(LOCK_H-TZ)*3600000;
const lockLeft=()=>Math.max(0,lockAt(curWeek())-now());
const weekElapsed=()=>Math.min(1,Math.max(0,1-lockLeft()/(7*864e5)));
/* تمييز العدد: مفرد / مثنى / جمع (٣-١٠) / مفرد منصوب (١١ فأكثر) — مع المثنى لا يُذكر الرقم */
const plural=(n,f)=>n===1?f[0]:n===2?f[1]:n<=10?n+' '+f[2]:n+' '+f[3];
const wkU=n=>n>=3&&n<=10?'أسابيع':n>10?'أسبوعًا':'أسبوع';
function lockText(){const ms=lockLeft(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
 const D=plural(d,['يوم','يومين','أيام','يومًا']),H=plural(h,['ساعة','ساعتين','ساعات','ساعة']),
  M=plural(m,['دقيقة','دقيقتين','دقائق','دقيقة']);
 if(d)return D+(h?' و'+H:'');if(h)return H+(m?' و'+M:'');return m?M:'أقل من دقيقة'}
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function weekLabel(w){const a=addDays(w,-7),[,am,ad]=a.split('-').map(Number),[,bm,bd]=w.split('-').map(Number);
 return am===bm?`${ad}–${bd} ${MONTHS[bm-1]}`:`${ad} ${MONTHS[am-1]} – ${bd} ${MONTHS[bm-1]}`}
const weekShort=w=>{const[,m,d]=w.split('-').map(Number);return d+'/'+m};
function weekName(w){const k=Math.round((Date.parse(curWeek())-Date.parse(w))/(7*864e5));
 return k<=0?'هذا الأسبوع':k===1?'الأسبوع الماضي':'قبل '+plural(k,['أسبوع','أسبوعين','أسابيع','أسبوعًا'])}
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dayLabel=i=>DAYS[new Date(i+'T00:00Z').getUTCDay()];
let ENTRIES=[];
let GOALS_OPEN=true;  /* نافذة تعديل المقدار — يفتحها التنفيذي ويغلقها */

/* ==================== أدوات ==================== */
let S={role:null,me:null,view:'today',field:null,student:null,modal:null,toast:null,buf:''};
const $=s=>document.querySelector(s), shell=()=>document.getElementById('shell');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ── فهارس تُبنى مرة واحدة لكل تحميل: كل استعلام بعدها قراءة مباشرة لا مسح ── */
const EMPTY={p:0,m:0,list:[]};
let WK={},BYCODE={},CTOT={},TOT={},MEMO={};
function reindex(){WK={};BYCODE={};CTOT={};TOT={};MEMO={};rebuildHold();
 for(const e of ENTRIES){
  const k=e.code+'|'+e.week, d=WK[k]||(WK[k]={p:0,m:0,list:[]});
  d.p+=e.pages; d.m+=e.minutes; d.list.push(e);
  (BYCODE[e.code]||(BYCODE[e.code]=[])).push(e);
  const ck=e.code+'|'+e.course; CTOT[ck]=(CTOT[ck]||0)+e.pages+e.minutes;
  TOT[e.code]=(TOT[e.code]||0)+e.pages+e.minutes}}
function weekData(c,w){return WK[c+'|'+w]||EMPTY}
let EID=0; const newEid=()=>'e'+(++EID);
/* ── العهدة: حجز → تسليم → إرجاع، بتأكيد المشرف التنفيذي ── */
let LOAN={};
const lk=(c,i)=>c+'|'+i;
const loanOf=(c,i)=>LOAN[lk(c,i)];
const isPhysical=c=>c&&c.type==='read'&&c.copies!=null;
function reqList(){return Object.entries(LOAN).map(([k,v])=>
 ({code:k.slice(0,k.indexOf('|')),id:k.slice(k.indexOf('|')+1),...v}))}
function daysSince(d){return Math.max(0,Math.round((Date.parse(todayISO())-Date.parse(d))/864e5))}
/* ── مخزون النسخ ── */
let HOLD={},WAIT={};
function rebuildHold(){HOLD={};
 if(REMOTE&&REMOTE_HOLD){HOLD={...REMOTE_HOLD};return}
 for(const k in LOAN){const id=k.slice(k.indexOf('|')+1);HOLD[id]=(HOLD[id]||0)+1}}
const heldCount=id=>HOLD[id]||0;
function availOf(c){return (c.type!=='read'||c.copies==null)?null:Math.max(0,c.copies-heldCount(c.id))}
const waitList=id=>WAIT[id]||[];
const waitPos=(id,code)=>waitList(id).indexOf(code)+1;
/* المتاح يُوزّع على أوائل قائمة الانتظار أولًا؛ وما زاد عنهم يبقى متاحًا للآخرين. */
function canClaimCopy(c,code){if(!c)return false;const av=availOf(c);if(av===null)return true;if(av<1)return false;
 const q=waitList(c.id),p=q.indexOf(code);return p>-1?p<av:q.length<av}
const entriesOf=(c,w)=>w?weekData(c,w).list:(BYCODE[c]||[]);
const thisWeek=c=>entriesOf(c,curWeek());
const sum=(a,k)=>{let t=0;for(let i=0;i<a.length;i++)t+=a[i][k];return t};
function memo(k,fn){return k in MEMO?MEMO[k]:(MEMO[k]=fn())}
function canEditGoal(s){return GOALS_OPEN||!s.goalSet}
function toggleGoals(){return remoteCommand('toggle_goals',{},'تحدّثت نافذة المقادير.')}
const courseById=i=>COURSES.find(c=>c.id===i)||ARCHIVED_COURSES.find(c=>c.id===i)||PERSONAL_COURSES.find(c=>c.id===i);
const fieldById=i=>FIELDS.find(f=>f.id===i)||(i==='personal'?PERSONAL_FIELD:i==='wathba'?WATHBA_FIELD:null);
const personalCoursesOf=code=>PERSONAL_COURSES.filter(c=>c.owner===code);
const studentByCode=c=>STUDENTS.find(s=>s.code===c);
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):(a>0?100:0);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function hydrateRemote(state){
 const ps=state.profiles||[],shelves=state.shelves||[];
 if(state.week&&state.week.server_now){const t=Date.parse(state.week.server_now);if(t)SKEW=t-Date.now()}
 STUDENTS=ps.filter(x=>x.role==='student').map(x=>({code:x.public_code,name:x.name,group:x.group_name||'—',
  supervisor:x.supervisor_code||'',goalP:+x.week_goal_pages||140,goalM:+x.week_goal_minutes||210,goalSet:!!x.goal_set,shelf:[]}));
 SUPERVISORS=ps.filter(x=>x.role==='supervisor').map(x=>({code:x.public_code,name:x.name,group:x.group_name||'—'}));
 OBSERVERS=ps.filter(x=>x.role==='observer').map(x=>({code:x.public_code,name:x.name}));
 const ad=ps.find(x=>x.role==='admin');ADMIN=ad?{code:ad.public_code,name:ad.name}:{code:'',name:'مشرف تنفيذي'};
 for(const x of shelves){const st=studentByCode(x.public_code);if(st)st.shelf.push(x.course_id)}
 COURSES=[];ARCHIVED_COURSES=[];PERSONAL_COURSES=[];
 for(const x of (state.courses||[])){const c={id:x.id,field:x.field_id,type:x.course_type,title:x.title,
   by:x.author||'—',total:+x.total,note:x.note||'',copies:x.copies==null?null:+x.copies,
   url:x.resource_url||'',owner:x.owner_code||null,personal:!!x.owner_code,active:x.active!==false};
   (c.personal?PERSONAL_COURSES:c.active?COURSES:ARCHIVED_COURSES).push(c)}
 ENTRIES=(state.entries||[]).map(x=>({id:x.id,code:x.public_code,date:x.entry_date,course:x.course_id,
  week:x.week_end||weekOfMs(Date.parse(x.entry_date+'T12:00:00Z')),
  reviewed:!!x.reviewed,reviewedBy:x.reviewed_by||null,
  pages:+x.pages||0,minutes:+x.minutes||0}));
 LOAN={};for(const x of (state.loans||[]))LOAN[lk(x.public_code,x.course_id)]={st:x.status,at:x.status_date};
 WAIT={};for(const x of (state.waitlist||[]))WAIT[x.course_id]=x.public_codes||[];
 REMOTE_HOLD={};for(const x of (state.inventory||[]))REMOTE_HOLD[x.course_id]=+x.held_count||0;
 const set=state.settings||{};GOALS_OPEN=set.goals_open!==false;
 const ch=state.challenge;CHALLENGE=ch?{active:!!ch.active,title:ch.title||'',desc:ch.description||'',
  metric:ch.metric||'pages',target:+ch.target||1,start:ch.start_date,end:ch.end_date}
  :{active:false,title:'',desc:'',metric:'pages',target:1,start:null,end:null};
 LEADERBOARD=state.leaderboard||[];CHAL_BOARD=state.challenge_board||[];
 WATHBAS=(state.wathbas||[]).map(x=>({id:x.id,course:x.course_id,type:x.course_type,amount:+x.amount,
  unit:x.unit||'page',unitMin:+x.unit_minutes||1,bySup:!!x.by_supervisor,sort:+x.sort||0,
  opens:Date.parse(x.opens_at),closes:Date.parse(x.closes_at),
  title:x.title||'',desc:x.description||'',url:x.resource_url||''}));
 WDONE=(state.wathba_done||[]).map(x=>({w:x.wathba_id,code:x.public_code,day:x.done_day,benefit:x.benefit||''}));
 WMEM=(state.memorize||[]).map(x=>({w:x.wathba_id,code:x.public_code,verses:+x.verses,by:x.by||'',at:x.at}));
 reindex();
 return ps.find(x=>x.public_code===state.me?.public_code)||state.me
}
/* مسار موحّد لتطبيق حالة السيرفر: يحافظ على الشاشة الحالية ولا يعيد حركات الدخول. */
function applyState(state){
 const code=S.me&&S.me.code,role=S.role;hydrateRemote(state);
 S.me=role==='student'?studentByCode(code):role==='supervisor'?SUPERVISORS.find(x=>x.code===code)
  :role==='observer'?OBSERVERS.find(x=>x.code===code):ADMIN;
 if(!S.me)return logout();
 renderShell()}
async function rpcState(fn,args,fallback){
 if(rpcState.busy)return;rpcState.busy=true;
 try{const {data,error}=await SB.rpc(fn,args);if(error)throw error;
  S.modal=null;renderModal();applyState(data.state);toast(data.message||fallback||'تم الحفظ.');return data.result||true
 }catch(e){toast(e.message||'تعذّر الحفظ. حاول مرة أخرى.')}finally{rpcState.busy=false}}
function remoteCommand(command,payload,success){
 return rpcState('app_command',{p_command:command,p_payload:payload||{}},success)}
async function initRemote(){
 drawLogin('جاري الاتصال…');
 try{const {data}=await SB.auth.getSession();if(!data.session){const r=await SB.auth.signInAnonymously();if(r.error)throw r.error}
  REMOTE_READY=true;drawLogin()
 }catch(e){drawLogin('تعذّر الاتصال. تأكد من تفعيل Anonymous Sign-Ins في Supabase ثم حدّث الصفحة.')}}

/* ==================== عدّاد الإقفال ====================
   مؤقت واحد كل ٢٠ ثانية يحدّث نص العدّاد فقط (لا إعادة رسم).
   عند عبور لحظة الإقفال يُعاد رسم الشاشة مرة واحدة لأن الأسبوع تغيّر. */
let TICK=null,TICK_WEEK='';
function tick(){if(!S.role||document.hidden)return;
 const w=curWeek();
 if(w!==TICK_WEEK){TICK_WEEK=w;lastKey='';renderShell();return}
 document.querySelectorAll('[data-lock]').forEach(el=>{const t=lockText();
  if(el.textContent!==t){el.textContent=t;if(!reduced){el.classList.remove('upd');void el.offsetWidth;el.classList.add('upd')}}});
 const soon=lockLeft()<864e5;document.querySelectorAll('.lockchip').forEach(c=>c.classList.toggle('soon',soon))}
function startTick(){TICK_WEEK=curWeek();clearInterval(TICK);TICK=setInterval(tick,20000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

 const b=S.buf;
 return `<div class="login">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="login-card" id="lcard">
   <svg class="logo-lg" viewBox="0 0 46 40" aria-hidden="true">
     <rect x="30" y="26" width="14" height="12" rx="2.5" fill="#0B5C55" opacity=".3"/>
     <rect x="16" y="15" width="14" height="23" rx="2.5" fill="#0B5C55" opacity=".62"/>
     <rect x="2" y="3" width="14" height="35" rx="2.5" fill="#0B5C55"/>
   </svg>
   <h1>خطوة</h1>
   <p class="sub">كل أسبوع خطوة. سجّل دخولك برمزك الرباعي.</p>
   <div class="code-wrap${err?' bad':''}" id="cw">
     ${[0,1,2,3].map(i=>`<div class="digit ${b[i]?'filled':''} ${b.length===i?'active':''}">${b[i]?`<span>${b[i]}</span>`:''}</div>`).join('')}
   </div>
   <div class="err">${err||''}</div>

     ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="tap(event,'${n}')">${n}</button>`).join('')}

   </div>
   <button class="btn" onclick="login()">دخول</button>
   <p class="hint">استخدم رمزك الشخصي المكوّن من أربعة أرقام.<br>لا تشاركه مع أحد.</p>
  </div></div>`;
}
function paintDigits(){const w=document.getElementById('cw');if(!w)return;
 [...w.children].forEach((d,i)=>{const v=S.buf[i]||'';
  d.className='digit'+(v?' filled':'')+(S.buf.length===i?' active':'');
  if(v!==(d.dataset.v||'')){d.innerHTML=v?'<span>'+v+'</span>':'';d.dataset.v=v}})}
function loginError(msg){const w=document.getElementById('cw'),e=document.querySelector('.err');
 if(e)e.textContent=msg; S.buf=''; if(w){w.classList.add('bad');
  setTimeout(()=>{w.classList.remove('bad');paintDigits()},480)}
 clearTimeout(loginError._t);loginError._t=setTimeout(()=>{if(e)e.textContent=''},3200)}
function tap(e,k){
 if(e){const b=e.currentTarget,r=b.getBoundingClientRect(),d=document.createElement('span');
  d.className='ripple';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';
  d.style.width=d.style.height='22px';b.appendChild(d);setTimeout(()=>d.remove(),560)}
 if(k==='back')S.buf=S.buf.slice(0,-1); else if(k==='clear')S.buf='';
 else if(S.buf.length<4)S.buf+=k;
 paintDigits();
 if(S.buf.length===4)setTimeout(login,220)}
function drawLogin(err){shell().innerHTML=loginHTML(err)}
async function login(){
 if(login.busy)return;if(!REMOTE_READY)return loginError('الاتصال بقاعدة البيانات لم يجهز بعد.');
 const v=S.buf;if(v.length!==4)return loginError('أدخل الرمز الرباعي كاملًا.');login.busy=true;
 let role=null,me=null,view='today';
 try{const {data,error}=await SB.rpc('claim_access_code',{p_code:v});if(error)throw error;
  if(data?.error)throw new Error(data.error);
  const p=hydrateRemote(data.state);role=p.role;me=role==='student'?studentByCode(p.public_code)
   :role==='supervisor'?SUPERVISORS.find(x=>x.code===p.public_code)
   :role==='observer'?OBSERVERS.find(x=>x.code===p.public_code):ADMIN;view=role==='student'?'today':'students'
 }catch(e){login.busy=false;const m=e.message||'';return loginError(m.includes('max_devices')?'بلغت الحد المسموح للأجهزة. راجع المشرف التنفيذي.':m.includes('too_many_attempts')?'محاولات كثيرة. انتظر 15 دقيقة ثم حاول مجددًا.':'الرمز غير صحيح أو غير مفعّل.');}
 const card=$('#lcard'); if(card&&!reduced){card.classList.add('leaving');}
 setTimeout(()=>{S={...S,role,me,view,buf:'',field:null,student:null};lastKey='';renderShell();startTick();login.busy=false},reduced?0:340);
}
function logout(){const m=shell().querySelector('main');if(m&&!reduced)m.style.opacity=0;clearInterval(TICK);
 setTimeout(()=>{S={role:null,me:null,view:'today',field:null,student:null,modal:null,buf:''};lastKey='';drawLogin();},reduced?0:200);}

/* ==================== الطالب ==================== */
function courseProgress(code,c){return CTOT[code+'|'+c.id]||0}
function shelfOf(code){const s2=studentByCode(code);return (s2&&s2.shelf)||[]}
function onShelf(code,id){return shelfOf(code).indexOf(id)>-1}
function isDone(code,c){return courseProgress(code,c)>=c.total}
function openShelfOf(code){return shelfOf(code).filter(id=>{const c=courseById(id);
 return c&&c.field!=='wathba'&&!isDone(code,c)})}
const onOpenShelf=(code,id)=>openShelfOf(code).indexOf(id)>-1;
function shelfCourses(code,type){return shelfOf(code).map(courseById)
 .filter(c=>c&&c.field!=='wathba'&&c.type===type&&!isDone(code,c))}
function finishedCourses(code){return COURSES.concat(personalCoursesOf(code))
 .filter(c=>courseProgress(code,c)>=c.total&&courseProgress(code,c)>0)}
function startCourse(id,quiet){const c=courseById(id);
 if(onShelf(S.me.code,id)||loanOf(S.me.code,id))return Promise.resolve();
 if(!c||!canClaimCopy(c,S.me.code)){if(!quiet){S.modal={t:'taken',id};renderModal()}return Promise.resolve()}
 return remoteCommand('start_course',{course_id:id},'تحدّث رفّك.')}
function handOver(code,id){return remoteCommand('hand_over',{public_code:code,course_id:id},'تم تسليم النسخة.')}
function rejectReq(code,id){return remoteCommand('cancel_loan',{public_code:code,course_id:id},'أُلغي الحجز.')}
function markReturn(id){return remoteCommand('mark_return',{course_id:id},'سُجّل طلب الإرجاع.')}
function confirmReturn(code,id){return remoteCommand('confirm_return',{public_code:code,course_id:id},'تم تأكيد الاستلام.')}
function stopCourse(id){return remoteCommand('stop_course',{course_id:id},'تحدّث رفّك.')}
function joinWait(id){return remoteCommand('join_wait',{course_id:id},'أُضيف اسمك لقائمة الانتظار.')}
function leaveWait(id){return remoteCommand('leave_wait',{course_id:id},'خرجت من قائمة الانتظار.')}
/* ── إدارة صفوف الانتظار (المشرف التنفيذي) ── */
function markRowBusy(el,cls){const row=el&&el.closest('.wrow');
 if(row&&!reduced)row.classList.add(cls);return row}
function assignCopy(id,code,el){markRowBusy(el,'busy');
 return remoteCommand('assign_copy',{course_id:id,public_code:code},'خُصّصت النسخة.')}
function dropWait(id,code,el){markRowBusy(el,'leaving');
 return remoteCommand('drop_wait',{course_id:id,public_code:code},'أُخرج من قائمة الانتظار.')}
function bumpCopies(id,d){return remoteCommand('bump_copies',{course_id:id,delta:d},'تحدّث عدد النسخ.')}
function setUnlimited(id){return remoteCommand('set_unlimited',{course_id:id},'أصبح المقرر بلا حصر.')}
function toFields(){const el=document.getElementById('fieldsec');
 el&&el.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'})}
function lastTouch(code,c){let last='';for(const e of entriesOf(code))if(e.course===c.id&&e.date>last)last=e.date;
 if(!last)return 'ما بدأت فيه بعد';
 const k=daysSince(last);
 return k===0?'آخر تسجيل: اليوم':k===1?'آخر تسجيل: أمس':'آخر تسجيل: قبل '+plural(k,['يوم','يومين','أيام','يومًا'])}
function coverArt(c,f,p,W,H2){
 const H=H2||104,fh=Math.max(2,H*p/100),w=W||70,x=(W?4:8);
 return c.type==='read'
  ? `<svg viewBox="0 0 ${w+2*x} ${H+12}" aria-hidden="true">
      <rect x="${x}" y="6" width="${w}" height="${H}" rx="6" fill="${f.c}" opacity=".16"></rect>
      <rect class="fillbar" x="${x}" y="${6+H-fh}" width="${w}" height="${fh}" rx="6" fill="${f.c}"></rect>
      <rect x="${x}" y="6" width="${w}" height="${H}" rx="6" fill="none" stroke="${f.c}" stroke-opacity=".45"></rect>
      <rect x="${x+6}" y="6" width="2.5" height="${H}" fill="#fff" opacity=".5"></rect>
      ${[.22,.34,.46].map((r,k)=>`<rect x="${x+16}" y="${6+H*r}" width="${k===2?w*.36:w*.62}" height="3" rx="1.5" fill="#fff" opacity=".72"></rect>`).join('')}
     </svg>`
  : `<svg viewBox="0 0 ${w+2*x} ${H+12}" aria-hidden="true">
      <rect x="${x}" y="6" width="${w}" height="${H}" rx="14" fill="${f.c}" opacity=".16"></rect>
      <rect class="fillbar" x="${x}" y="${6+H-fh}" width="${w}" height="${fh}" rx="14" fill="${f.c}"></rect>
      <rect x="${x}" y="6" width="${w}" height="${H}" rx="14" fill="none" stroke="${f.c}" stroke-opacity=".45"></rect>
      <g transform="translate(${x+w/2},${6+H*.4}) scale(${w/70})">
        <path d="M-15 6v-3a15 15 0 0130 0v3M-15 6h6v11h-6zM9 6h6v11H9z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".9"/></g>
      <g transform="translate(${x+w/2},${6+H*.76}) scale(${w/70})">${[-18,-11,-4,3,10,17].map((px,k)=>{const h=[7,15,22,11,18,8][k];
        return `<rect x="${px}" y="${-h/2}" width="4" height="${h}" rx="2" fill="#fff" opacity=".75"></rect>`}).join('')}</g>
     </svg>`}

     <span class="kicker"><span class="dot" style="background:${f.c}"></span>${f.name} · ${read?'قرائي':'سماعي'}</span>

     ${c.note?`<p class="cnote" style="margin-top:6px" onclick="this.classList.toggle('open')">${esc(c.note)}</p>`:''}
     <div class="bprog">

       <p class="blast">${fin?'أتممته كاملًا — بارك الله فيك.':lastTouch(S.me.code,c)+' · باقي '+Math.max(0,c.total-dn)+' '+unit}</p>
       <div class="bactions">
        ${!read&&c.url?`<a class="btn sm media-link" style="flex:1;background:${f.c}" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">الانتقال للمقطع ↗</a>`:''}
        ${fin?`<button class="btn sm outline" style="flex:1;border-color:${f.c};color:${f.c}" onclick="stopCourse('${c.id}')">${isPhysical(c)?'أعدت الكتاب':'انقله للمكتملة'}</button>`
             :`<button class="btn sm outline" style="flex:1;border-color:${f.c};color:${f.c}" onclick="openLog('${c.id}')">${read?'سجّل قراءة':'سجّل سماع'}</button>
               <button class="iconbtn" title="إيقاف المتابعة" onclick="stopCourse('${c.id}')">✕</button>`}

/* ---------- بطاقة الأسبوع ----------
   الحلقة تقول «كم أنجزت»، وشريط الوتيرة يقول «هل أنت في الموعد»:
   العلامة الرأسية = كم مضى من الأسبوع، والتعبئة = نسبة إنجازك. */
function lockChip(){return `<span class="lockchip ${lockLeft()<864e5?'soon':''}" title="يُقفل الخميس ٣:٠٠ عصرًا">
  <i class="tick"></i>يُقفل بعد <b data-lock>${lockText()}</b></span>`}
function weekCard(me){
 const w=curWeek(),e=entriesOf(me.code,w),p=sum(e,'pages'),m=sum(e,'minutes');
 const pp=pct(p,me.goalP),mp=pct(m,me.goalM),all=Math.round((pp+mp)/2),done=pp>=100&&mp>=100;
 const R1=64,R2=48,C1=2*Math.PI*R1,C2=2*Math.PI*R2;
 const el=Math.round(weekElapsed()*100),gap=all-el,state=done?'ahead':gap>=0?'ahead':gap>-15?'':'behind';
 const rp=Math.max(0,me.goalP-p),rm=Math.max(0,me.goalM-m),str=streakOf(me.code);
 const dl=Math.max(1,Math.ceil(lockLeft()/864e5));
 const perDay=[rp?`<b class="num">${Math.ceil(rp/dl)}</b> صفحة`:'',rm?`<b class="num">${Math.ceil(rm/dl)}</b> دقيقة`:''].filter(Boolean).join(' و');
 return `<div class="card stagger" style="--i:0">
   <div class="weekhead">
    <div><p class="eyebrow">${weekLabel(w)}</p><h2>إنجاز هذا الأسبوع</h2></div>
    <div class="acts">${done?'<span class="donebadge">✓ اكتمل المقدار</span>':lockChip()}</div>
   </div>
   ${canEditGoal(me)&&!done?`<div class="guard" style="margin-top:14px;background:var(--teal-soft);border-color:#BFE0DA;color:var(--teal)">
     <span class="gi">🔓</span><span>${me.goalSet?'نافذة تعديل المقدار مفتوحة':'حدّد مقدارك الأسبوعي لتبدأ'} —
     <b style="cursor:pointer;text-decoration:underline" onclick="openGoal()">اضبطه الآن</b></span></div>`:''}
   <div class="ring-row">
    <div class="ring-box" style="width:150px;height:150px">
      ${done?'<span class="pulse"></span>':''}
      <svg class="ring" viewBox="0 0 150 150">
        <circle class="track" cx="75" cy="75" r="${R1}" stroke-width="11"></circle>
        <circle class="track" cx="75" cy="75" r="${R2}" stroke-width="11"></circle>
        <circle class="arc" cx="75" cy="75" r="${R1}" stroke="var(--teal)" stroke-width="11"
          stroke-dasharray="${C1}" stroke-dashoffset="${C1}" data-off="${C1*(1-pp/100)}"></circle>
        <circle class="arc" cx="75" cy="75" r="${R2}" stroke="var(--gold)" stroke-width="11"
          stroke-dasharray="${C2}" stroke-dashoffset="${C2}" data-off="${C2*(1-mp/100)}"></circle>
      </svg>
      <div class="ring-mid"><b class="num" data-to="${all}" data-suffix="%">0%</b><span>من المقدار</span></div>
    </div>
    <div class="legend">
      <div><div class="k"><i class="sw" style="background:var(--teal)"></i>قراءة</div>
        <div class="v"><span class="num" data-to="${p}">0</span> <small>من ${me.goalP} صفحة</small></div></div>
      <div><div class="k"><i class="sw" style="background:var(--gold)"></i>سماع</div>
        <div class="v"><span class="num" data-to="${m}">0</span> <small>من ${me.goalM} دقيقة</small></div></div>
      <button class="btn sm outline" style="align-self:flex-start" onclick="openGoal()">${canEditGoal(me)?'✎ تعديل المقدار':'🔒 مقدارك الأسبوعي'}</button>
    </div>
   </div>

/* ==================== لوحات المشرفين ==================== */
let FILTER='all';
function setFilter(f){FILTER=f;lastKey='';renderShell()}
/* نسبة الأسبوع = متوسط (صفحاته ÷ مقداره) و(دقائقه ÷ مقداره)، كلٌّ بسقف ١٠٠ — مطابقة لـ week_rate في السيرفر */
function rateOf(s,w){return memo('r|'+s.code+'|'+w,()=>{const x=weekData(s.code,w);
 return Math.round((pct(x.p,s.goalP)+pct(x.m,s.goalM))/2)})}
function achievementRate(s,n){n=n||4;return memo('avg|'+n+'|'+s.code,()=>{
 let t=0;for(let k=0;k<n;k++)t+=rateOf(s,weekISO(k));return Math.round(t/n)})}
function metGoal(s,w){if(!s)return false;const x=weekData(s.code,w);
 return x.p>=s.goalP&&x.m>=s.goalM}
function streakOf(c){return memo('st'+c,()=>{const st=studentByCode(c);if(!st)return 0;
 let n=0;const from=metGoal(st,curWeek())?0:1;   /* الأسبوع الحالي لسه مفتوح: نعدّ من الماضي */
 for(let k=from;k<26;k++){if(metGoal(st,weekISO(k)))n++;else break}
 return n})}
function streakAtRisk(s){return !metGoal(s,curWeek())&&streakOf(s.code)>0}
/* كم أسبوعًا مضى منذ آخر تسجيل: ٠ = سجّل هذا الأسبوع */
function idleWeeks(c){return memo('iw'+c,()=>{
 for(let k=0;k<26;k++){if(weekData(c,weekISO(k)).list.length)return k}return 99})}
function statusOf(s){const r=rateOf(s,curWeek()),idl=idleWeeks(s.code);
 if(r>=100)return{k:'ok',t:'حقق مقداره',c:'var(--teal)'};
 if(idl>=2)return{k:'off',t:idl>=26?'ما بدأ بعد':'غاب '+plural(idl,['أسبوعًا','أسبوعين','أسابيع','أسبوعًا']),c:'var(--rose)'};
 if(r>0)return{k:'mid',t:'في الطريق',c:'var(--gold)'};
 return{k:'mid',t:'ما سجّل هذا الأسبوع',c:'var(--gold)'}}
function heatColor(r){return r>=100?'var(--teal)':r>=60?'#3E8B82':r>=30?'#7FB8B1':r>0?'#B9D6D1':'#EAEDE8'}
function myStudents(){return S.role==='admin'||S.role==='observer'?STUDENTS:STUDENTS.filter(s=>s.supervisor===S.me.code)}
function statStrip(items){return `<div class="stat-strip">${items.map((x,i)=>
 `<div class="stat stagger" style="--i:${i};--sc:${x.c||'var(--teal)'}">
   <div class="lab">${x.lab}</div>

  </div>`).join('')}</div>`}

/* ---------- منحنى نبض المجموعة ---------- */
function sparkline(list,weeks){
 const W=1000,H=96,n=weeks||12;
 const pts=[...Array(n)].map((_,k)=>{const w=weekISO(n-1-k);
  const v=list.length?list.reduce((t,s)=>t+Math.min(100,rateOf(s,w)),0)/list.length:0;
  return{x:W-(W/(n-1))*(n-1-k),y:H-10-(H-26)*(v/100),v:Math.round(v)}});
 const sm=pts.map((p,k)=>{if(!k)return `M${p.x.toFixed(1)},${p.y.toFixed(1)}`;
  const q=pts[k-1],cx=(q.x+p.x)/2;
  return `C${cx.toFixed(1)},${q.y.toFixed(1)} ${cx.toFixed(1)},${p.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ');
 const last=pts[pts.length-1];
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="نبض المجموعة آخر ${n} أسبوعًا">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6FD3C4" stop-opacity=".42"/><stop offset="1" stop-color="#6FD3C4" stop-opacity="0"/></linearGradient></defs>
  <path class="area" d="${sm} L${W},${H} L0,${H} Z" fill="url(#sg)"></path>
  <path class="line" pathLength="1" d="${sm}"></path>
  <circle class="gl" cx="${last.x-3}" cy="${last.y}" r="7" stroke-width="2"></circle>
  <circle class="pt" cx="${last.x-3}" cy="${last.y}" r="4.5"></circle>
 </svg>`}
function heroPanel(){
 const list=myStudents(),w=curWeek();
 const done=list.filter(s=>rateOf(s,w)>=100).length;
 const act=list.filter(s=>weekData(s.code,w).list.length).length;
 const avg=list.length?Math.round(list.reduce((t,s)=>t+Math.min(100,rateOf(s,w)),0)/list.length):0;
 let P=0,M=0;for(const s of list){const x=weekData(s.code,w);P+=x.p;M+=x.m}
 const hour=riyadhNow().getUTCHours();
 const greet=hour>=4&&hour<12?'صباح الخير':'مساء الخير';
 return `<div class="hero stagger">
  <div class="htop">
   <div><p class="hlab">${greet} · ${weekLabel(w)} · يُقفل بعد <span data-lock>${lockText()}</span></p>
    <h2>${S.role==='admin'||S.role==='observer'?'نبض البرنامج':'نبض '+esc(S.me.group)}</h2></div>
   <div class="hstats">
    <div class="hstat"><div class="hk">متوسط الإنجاز هذا الأسبوع</div>
      <div class="hv goldv"><span class="num" data-to="${avg}" data-suffix="%">0%</span></div></div>
    <div class="hstat"><div class="hk">حققوا المقدار</div>
      <div class="hv tealv"><span class="num" data-to="${done}">0</span> <small>من ${list.length}</small></div></div>
    <div class="hstat"><div class="hk">سجّلوا هذا الأسبوع</div>
      <div class="hv"><span class="num" data-to="${act}">0</span> <small>طالب</small></div></div>
    <div class="hstat"><div class="hk">إنجاز الأسبوع</div>
      <div class="hv"><span class="num" data-to="${P}">0</span> <small>ص · ${M} د</small></div></div>
   </div></div>
  ${sparkline(list)}
  <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#7C8F88;margin-top:-4px">
   <span>قبل ١٢ أسبوعًا</span><span>هذا الأسبوع</span></div>
 </div>`}

/* ---------- مصفوفة المواظبة (كل مربع = أسبوع) ---------- */

   <div></div>${weeks.map((w,k)=>`<div class="mhd${k===N-1?' now':''}" title="${weekLabel(w)}">${weekShort(w)}</div>`).join('')}

     return `<div class="mrow"><div class="mname" style="--sc:${st.c}">
       <span class="av">${esc(s.name.trim()[0])}</span><span>${esc(s.name)}</span></div>

        return `<div class="mc ${k===N-1?'today':''}" style="--r:${r};--k:${k};background:${heatColor(rt)}"
         role="button" tabindex="0" title="${inf}" data-inf="${inf}"
         onclick="cellInfo(this,'matinfo')" onkeydown="if(event.key==='Enter')cellInfo(this,'matinfo')"></div>`}).join('')}

/* ---------- بطاقة طالب ---------- */
function miniBars(s){const N=8,W=240,H=46,bw=W/N-6;
 return `<svg class="mini" viewBox="0 0 ${W} ${H}" aria-hidden="true">${[...Array(N)].map((_,k)=>{
  const w=weekISO(N-1-k),r=rateOf(s,w),h=Math.max(5,H*0.16+H*0.72*Math.min(1,r/100));
  const x=W-(k+1)*(bw+6)+3,y=H-h,f=r>=100?'var(--teal)':r>0?'#9BC5BF':'#E7EAE5';
  return `<rect style="--j:${k}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="3.5" fill="${f}"></rect>`}).join('')}</svg>`}
function scard(s,i){
 const st=statusOf(s),w=curWeek(),r=rateOf(s,w),x=weekData(s.code,w);
 const C=2*Math.PI*20,str=streakOf(s.code),open=openShelfOf(s.code).length;
 return `<button class="scard stagger" style="--i:${i};--sc:${st.c}" onclick="viewStudent('${s.code}')">
  <div class="head">
   <span class="avatar">${esc(s.name.trim()[0])}</span>
   <span class="nm"><b>${esc(s.name)}</b><span>${esc(s.group)} · <span class="num">${s.code}</span></span></span>
   <span class="ringwrap"><svg class="ringlet" viewBox="0 0 46 46">
     <circle class="t" cx="23" cy="23" r="20"></circle>
     <circle class="a" cx="23" cy="23" r="20" stroke="${st.c}" stroke-dasharray="${C}"
       stroke-dashoffset="${C}" data-off="${C*(1-Math.min(100,r)/100)}"></circle></svg>
    <b>${r}%</b></span></div>
  ${miniBars(s)}
  <div class="foot"><span class="pill ${st.k}">${st.k==='ok'?'✓':st.k==='off'?'!':'•'} ${st.t}</span>
   <span class="num">${x.p}ص · ${x.m}د</span></div>
  <div class="foot" style="border:0;padding-top:7px;margin-top:0">
   <span>${!s.goalSet?'⏳ ':''}${open} مقرر مفتوح · المقدار <span class="num" style="color:var(--ink)">${s.goalP}ص · ${s.goalM}د</span></span>
   <span>${str>0?`🔥 <span class="num">${str}</span> ${wkU(str)}`:'—'}</span></div></button>`}

/* ---------- رصد التسجيلات غير الدقيقة (بمقاييس أسبوعية) ---------- */
function flagsOf(st,e){const c=courseById(e.course),out=[];
 const v=e.pages||e.minutes,goal=e.pages?st.goalP:st.goalM,unit=e.pages?'صفحة':'دقيقة';
 if(c&&v>c.total)out.push('أكبر من حجم المقرر كله ('+c.total+' '+unit+')');
 if(e.pages>400)out.push('أكثر من ٤٠٠ صفحة في تسجيل واحد');
 if(e.minutes>1500)out.push('أكثر من ٢٥ ساعة سماع في تسجيل واحد');
 if(goal&&v>=goal*2&&v>=60)out.push('ضعف مقداره الأسبوعي في تسجيل واحد');
 return out}
function flaggedEntries(list){const out=[];
 list.forEach(st=>entriesOf(st.code).forEach(e=>{const f=flagsOf(st,e);if(f.length)out.push({st,e,f})}));
 return out.sort((a,b)=>(a.e.reviewed?1:0)-(b.e.reviewed?1:0)||b.e.date.localeCompare(a.e.date))}
function flagRow(x){const c=courseById(x.e.course),done=!!x.e.reviewed,ro=S.role==='observer';
 return `<div class="course flagrow ${done?'done':''}" id="fg_${x.e.id}">
   <span class="dot" style="background:${done?'var(--teal)':'var(--rose)'}"></span>
   <div class="meta"><b>${esc(x.st.name)} — <span class="num">${x.e.pages||x.e.minutes}</span> ${x.e.pages?'صفحة':'دقيقة'}</b>
    <span>${esc(c?c.title:'—')} · <span class="num">${x.e.date}</span> · ${x.f.join(' · ')}</span>
    <span class="revby">${done?'✓ تمت المراجعة'+(x.e.reviewedBy?' · '+esc(x.e.reviewedBy):''):''}</span></div>
   <button class="btn sm outline" onclick="viewStudent('${x.st.code}')">صفحته</button>
   ${ro?'':`<button class="revbtn ${done?'on':''}" title="${done?'تراجع عن المراجعة':'ضع علامة تمت المراجعة'}"
     onclick="toggleReview('${x.e.id}',this)">✓</button>`}</div>`}
function flagCard(list,i){const fl=flaggedEntries(list);if(!fl.length)return '';
 const open=fl.filter(x=>!x.e.reviewed).length;
 return `<div class="card stagger flagcard ${open?'':'clear'}" id="flagcard"
   style="--i:${i};margin-bottom:14px;border-color:${open?'#F0D9DF':'#BFE0DA'}">

/* تبديل المراجعة: نداء خفيف يرجّع سطرًا واحدًا، ونعدّل العقدة مكانها بلا إعادة رسم. */
async function toggleReview(eid,btn){
 if(btn.dataset.busy)return;
 const e=ENTRIES.find(x=>x.id===eid);if(!e)return;
 const next=!e.reviewed,row=document.getElementById('fg_'+eid);
 btn.dataset.busy='1';btn.classList.add('busy');
 btn.classList.toggle('on',next);if(row)row.classList.toggle('done',next);
 try{const {data,error}=await SB.rpc('review_entry',{p_entry:eid,p_reviewed:next});
  if(error)throw error;
  e.reviewed=!!data.reviewed;e.reviewedBy=data.by||null;
  if(row){const lbl=row.querySelector('.revby'),dot=row.querySelector('.dot');
   if(lbl)lbl.textContent=e.reviewed?'✓ تمت المراجعة'+(e.reviewedBy?' · '+e.reviewedBy:''):'';
   if(dot)dot.style.background=e.reviewed?'var(--teal)':'var(--rose)'}
  refreshFlagPill()
 }catch(err){
  btn.classList.toggle('on',e.reviewed);if(row)row.classList.toggle('done',e.reviewed);
  toast(err.message||'تعذّر حفظ المراجعة.')
 }finally{btn.removeAttribute('data-busy');btn.classList.remove('busy')}}
function refreshFlagPill(){const pill=document.getElementById('flagpill'),card=document.getElementById('flagcard');
 if(!pill)return;
 const open=flaggedEntries(myStudents()).filter(x=>!x.e.reviewed).length;
 pill.className='pill '+(open?'off':'ok');
 pill.innerHTML=open?'⚠ <span class="num">'+open+'</span>':'✓ راجعتها كلها';
 if(card){card.classList.toggle('clear',!open);card.style.borderColor=open?'#F0D9DF':'#BFE0DA'}}

/* ==================== مسار الوثبات ====================
   ثلاث وثبات بنافذة واحدة. القراءة والسماع يسجّلهما الطالب،
   والحفظ يكتبه المشرف بعد التسميع. المقياس المعروض هو الوتيرة لا النسبة. */
const UNIT={page:['صفحة','صفحتان','صفحات','صفحة'],video:['مقطع','مقطعان','مقاطع','مقطعًا'],
            verse:['بيت','بيتان','أبيات','بيتًا']};
const uname=(u,n)=>{const f=UNIT[u];n=Math.abs(+n||0);
 return n===1?f[0]:n===2?f[1]:n<11?f[2]:f[3]};
const WEEK=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const wOpen=()=>WATHBAS.filter(w=>now()>=w.opens&&now()<w.closes);
const wTrack=()=>wOpen().slice().sort((a,b)=>a.sort-b.sort);
const wClosesAt=()=>{const t=wTrack();return t.length?Math.max(...t.map(w=>w.closes)):0};
const memOf=(wid,code)=>WMEM.find(x=>x.w===wid&&x.code===code);
function fmtWhen(ms){const d=new Date(ms+TZ*3600000),h=d.getUTCHours(),m=d.getUTCMinutes();
 const today=todayISO(),iso=new Date(ms+TZ*3600000-DAY_START*3600000).toISOString().slice(0,10);
 const day=iso===today?'اليوم':iso===addDays(today,1)?'غدًا':WEEK[d.getUTCDay()];
 const h12=h%12||12,per=h<12?'صباحًا':h<17?'ظهرًا':'مساءً';
 return day+' '+h12+(m?':'+String(m).padStart(2,'0'):'')+' '+per}
function wProgress(w,code){
 if(w.bySup){const m=memOf(w.id,code);return m?m.verses:0}
 const raw=CTOT[code+'|'+w.course]||0;
 return w.unit==='video'?Math.floor(raw/Math.max(1,w.unitMin)):raw}
function wPace(w,code){
 const done=wProgress(w,code),left=Math.max(0,w.amount-done);
 const total=Math.max(1,Math.round((w.closes-w.opens)/864e5));
 const passed=Math.min(total,Math.max(0,Math.ceil((now()-w.opens)/864e5)));
 const daysLeft=Math.max(1,total-passed+1);
 const should=Math.round(w.amount*passed/total);
 return{done,left,total,passed,daysLeft,should,
  per:Math.ceil(left/daysLeft),
  diff:done-should,
  pct:pct(done,w.amount),
  state:done>=w.amount?'done':done>=should?(done>should?'ahead':'ontime'):'behind'}}
const wAllDone=code=>{const t=wTrack();return t.length>0&&t.every(w=>wProgress(w,code)>=w.amount)};
const wCandidates=()=>STUDENTS.filter(s=>wAllDone(s.code));

 const doneN=t.filter(w=>wProgress(w,me)>=w.amount).length;
 const all=doneN===t.length;
 return `<section class="trk stagger ${all?'allin':''}" style="--i:${i}">
  <div class="trkhead">

   <div class="trkdays"><div class="d num">${daysLeft}</div>

  <div class="trkrows">${t.map((w,k)=>wRow(w,me,k)).join('')}</div>
  ${all?'':`<p class="trknote">لتختم في الموعد: ${t.filter(w=>wPace(w,me).left>0)
    .map(w=>{const p=wPace(w,me);return p.per===2?`<b>${uname(w.unit,2)}</b>`
      :`<b>${p.per}</b> ${uname(w.unit,p.per)}`}).join(' · ')} يوميًا.</p>`}
 </section>`}
function wRow(w,code,k){
 const p=wPace(w,code),fin=p.state==='done';
 const lbl={done:'✓ أتممتها',ahead:'متقدّم',ontime:'في الموعد',behind:'متأخر'}[p.state];
 const tail=fin?'':p.state==='behind'
   ? `متأخر <b>${Math.abs(p.diff)}</b> ${uname(w.unit,Math.abs(p.diff))} — ارفعها إلى <b>${p.per}</b> ${uname(w.unit,p.per)} يوميًا لتلحق`
   : (p.per===2?`يكفيك <b>${uname(w.unit,2)}</b> يوميًا`:`يكفيك <b>${p.per}</b> ${uname(w.unit,p.per)} يوميًا`);
 return `<div class="trkrow ${p.state}" style="--k:${k}" id="tr_${w.id}">
  <span class="trknum num">${k+1}</span>
  <div class="trkbody">
   <div class="trktop"><b>${esc(w.title)}</b><span class="trkst">${lbl}</span></div>
   <div class="trkbar"><i data-w="${p.pct}"></i><u style="right:${Math.min(100,Math.round(p.should/w.amount*100))}%"></u></div>
   <div class="trkmeta">
    <span class="num">${p.done}</span> من <span class="num">${w.amount}</span> ${uname(w.unit,w.amount)}
    <span class="trkdot">·</span>${tail}</div>
   <div class="trkact">
    ${w.url?`<a class="trklink" href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">${
      w.unit==='video'?'افتح السلسلة ↗':w.unit==='verse'?'افتح المتن ↗':'افتح الكتاب ↗'}</a>`:''}
    ${w.bySup?`<span class="trkby">${(()=>{const m=memOf(w.id,code);
       return m?'آخر تسميع '+fmtDay(m.at)+(m.by?' · '+esc(m.by):''):'يسجّله مشرفك بعد التسميع'})()}</span>`
     :fin?'<span class="trkby">ختمتَها — بارك الله فيك</span>'
     :`<button class="trkgo" onclick="openWLog('${w.id}')">سجّل ${w.unit==='video'?'مقاطع':'صفحات'}</button>`}
   </div></div></div>`}
function fmtDay(iso){const k=Math.round((now()-Date.parse(iso))/864e5);
 return k<=0?'اليوم':k===1?'أمس':'قبل '+plural(k,['يوم','يومين','أيام','يومًا'])}

async function saveRec(wid,code,el){
 const w=WATHBAS.find(x=>x.id===wid);if(!w)return;
 let v=parseInt(el.value,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(w.amount,v));
 const cur=wProgress(w,code);
 if(v===cur){el.value=cur;return}
 el.disabled=true;
 try{const {data,error}=await SB.rpc('set_memorize',{p_public_code:code,p_wathba:wid,p_verses:v});
  if(error)throw error;
  const row=WMEM.find(x=>x.w===wid&&x.code===code);
  if(row){row.verses=+data.verses;row.by=data.by;row.at=data.at}
  else WMEM.push({w:wid,code,verses:+data.verses,by:data.by,at:data.at});
  el.value=data.verses;paintRec(w,code,+data.verses,data.by,data.at);
 }catch(e){el.value=cur;toast(e.message||'تعذّر الحفظ.')}
 finally{el.disabled=false}}
function paintRec(w,code,v,by,at){
 const fin=v>=w.amount,row=document.getElementById('rec_'+code);
 const bar=document.getElementById('recbar_'+code),pill=document.getElementById('recpill_'+code);
 const when=document.getElementById('recwhen_'+code);
 if(bar)bar.style.width=pct(v,w.amount)+'%';
 if(pill){pill.className='recpill'+(fin?' ok':'');pill.textContent=fin?'✓ أتمّ':pct(v,w.amount)+'%'}
 if(when)when.textContent='آخر تسميع '+fmtDay(at)+(by?' · '+by:'');
 if(row){row.classList.toggle('fin',fin);
  if(!reduced){row.classList.remove('saved');void row.offsetWidth;row.classList.add('saved')}}}
